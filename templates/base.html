{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Tomorrow Bus{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        /* ── 기본 리셋 ── */
        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            min-height: 100%;
            font-family: "Segoe UI", "Malgun Gothic", sans-serif;
            background: #fff;
            color: #1a1218;
        }

        /* ── CSS 변수 ── */
        :root {
            --pink:        #f472b6;
            --pink-deep:   #ec4899;
            --pink-soft:   rgba(244,114,182,0.10);
            --purple:      #a855f7;
            --purple-soft: rgba(168,85,247,0.10);
            --text-main:   #1a1218;
            --text-sub:    #8a7a90;
            --text-muted:  #b0a0b8;
            --border:      #f0ecf8;
            --radius-xl:   20px;
            --radius-lg:   16px;
            --radius-md:   12px;
            --shadow-card: 0 4px 24px rgba(192,132,252,0.08);
            --shadow-btn:  0 6px 22px rgba(244,114,182,0.38);
        }

        /* ── NAV ── */
        .tb-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 5%;
            background: #fff;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .tb-brand {
            display: flex;
            align-items: center;
            gap: 2px;
            text-decoration: none;
        }

        .tb-logo-img {
            width: 50px;
            height: 50px;
            object-fit: contain;
            display: block;
        }

        .tb-brand-name {
            font-size: 20px;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: -0.3px;
            display: block;
            line-height: 1;
            margin-bottom: 0;
            padding: 0;
        }

        .tb-brand-sub {
            font-size: 9px;
            color: var(--text-muted);
            margin-top: 0;
            line-height: 1;
            display: block;
        }

        .tb-nav-menu {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .tb-nav-menu a {
            font-size: 11px;
            color: #6b5f7a;
            padding: 8px 14px;
            border-radius: 9px;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.15s;
            white-space: nowrap;
        }

        .tb-nav-menu a:hover {
            color: var(--pink);
        }

        .tb-nav-menu a.active {
            color: var(--pink);
            border-bottom: 2px solid var(--pink);
            border-radius: 0;
        }

        /* ── 페이지 래퍼 ── */
        .tb-page {
            min-height: calc(100vh - 68px);
        }

        /* ── 공통 카드 ── */
        .tb-card {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-card);
        }

        /* ── 공통 버튼 ── */
        .btn-tb-main {
            background: linear-gradient(135deg, var(--pink), #fb7185);
            color: #fff;
            font-size: 13px;
            font-weight: 700;
            padding: 13px 24px;
            border-radius: var(--radius-md);
            border: none;
            cursor: pointer;
            box-shadow: var(--shadow-btn);
            letter-spacing: -0.2px;
            transition: opacity 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-tb-main:hover { opacity: 0.88; color: #fff; }

        .btn-tb-sec {
            background: #fff;
            color: #6b5f7a;
            font-size: 13px;
            font-weight: 600;
            padding: 12px 20px;
            border-radius: var(--radius-md);
            border: 1.5px solid var(--border);
            cursor: pointer;
            transition: border-color 0.15s, color 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-tb-sec:hover { border-color: var(--pink); color: var(--pink); }

        /* ── form select ── */
        .tb-select {
            height: 44px;
            border-radius: 11px;
            border: 1.5px solid var(--border);
            background: #fdfcff;
            padding: 0 14px;
            font-size: 12px;
            color: var(--text-main);
            appearance: none;
            width: 100%;
        }

        .tb-select:focus {
            outline: none;
            border-color: var(--purple);
            box-shadow: 0 0 0 3px rgba(168,85,247,0.1);
        }

        /* ── 혼잡도 배지 ── */
        .badge-여유 { background: #ecfdf5; color: #059669; padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; }
        .badge-보통 { background: #fefce8; color: #ca8a04; padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; }
        .badge-혼잡 { background: #fff5f8; color: var(--pink-deep); padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; }
        .badge-만차 { background: #fef2f2; color: #dc2626; padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; }

        /* ── 미디어 쿼리 ── */
        @media (max-width: 991px) {
            .tb-nav { padding: 12px 20px; }
            .tb-nav-menu a { padding: 7px 10px; font-size: 10px; }
        }

        @media (max-width: 575px) {
            .tb-nav { flex-direction: column; align-items: flex-start; gap: 10px; }
            .tb-nav-menu { flex-wrap: wrap; gap: 6px; }
        }
    </style>

    {% block extra_style %}{% endblock %}
</head>
<body>

<nav class="tb-nav">
    <a href="{% url 'home' %}" class="tb-brand">
        <img src="{% static 'bus/images/logo.png' %}" alt="Tomorrow Bus 로고" class="tb-logo-img">
        <div>
            <span class="tb-brand-name">Tomorrow Bus</span>
            <span class="tb-brand-sub">서울 광역버스 잔여좌석 예측 서비스</span>
        </div>
    </a>

    <nav class="tb-nav-menu">
        <a href="{% url 'home' %}"
           {% if request.resolver_match.url_name == 'home' %}class="active"{% endif %}>
            홈
        </a>
        <a href="{% url 'service1' %}"
           {% if request.resolver_match.url_name == 'service1' %}class="active"{% endif %}>
            서비스1 (정류장 단위 예측)
        </a>
        <a href="{% url 'service2' %}"
           {% if request.resolver_match.url_name == 'service2' %}class="active"{% endif %}>
            서비스2 (노선 전체 예측)
        </a>
        <a href="{% url 'favorites' %}"
           {% if request.resolver_match.url_name == 'favorites' %}class="active"{% endif %}>
            즐겨찾기
        </a>
    </nav>
</nav>

<div class="tb-page">
    {% block content %}{% endblock %}
</div>

{% include "footer.html" %}

{% block extra_script %}{% endblock %}
</body>
</html>
