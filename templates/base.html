{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Tomorrow Bus{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        /* ── 기본 리셋 ── */
        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            min-height: 100%;
            font-family: "Noto Sans KR", "Segoe UI", "Malgun Gothic", sans-serif;
            background: #fff;
            color: #1a2340;
            font-size: 15px;
            font-weight: 400;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ── CSS 변수 ── */
        :root {
            --blue:        #3b82f6;
            --blue-deep:   #2563eb;
            --blue-soft:   rgba(59,130,246,0.10);
            --indigo:      #4f46e5;
            --indigo-soft: rgba(79,70,229,0.10);
            --text-main:   #1a2340;
            --text-sub:    #64748b;
            --text-muted:  #94a3b8;
            --border:      #e2e8f4;
            --radius-xl:   20px;
            --radius-lg:   16px;
            --radius-md:   12px;
            --shadow-card: 0 4px 24px rgba(59,130,246,0.08);
            --shadow-btn:  0 6px 22px rgba(37,99,235,0.32);
        }

        /* ── NAV ── */
        .tb-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 48px;
            background: #fff;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .tb-brand {
            display: flex;
            align-items: center;
            gap: 0;
            text-decoration: none;
        }

        .tb-logo-img {
            width: 54px;
            height: 54px;
            object-fit: contain;
            flex-shrink: 0;
        }

        .tb-brand-text { margin-left: -4px; }

        .tb-brand-name {
            font-size: 17px;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: -0.3px;
            display: block;
            line-height: 1.2;
        }

        .tb-brand-sub {
            font-size: 10px;
            color: var(--text-muted);
            display: block;
            font-weight: 500;
        }

        .tb-nav-menu {
            display: flex;
            align-items: center;
            gap: 2px;
        }

        .tb-nav-menu a {
            font-size: 14px;
            color: #64748b;
            padding: 9px 16px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            transition: background 0.15s, color 0.15s;
            white-space: nowrap;
        }

        .tb-nav-menu a:hover {
            color: var(--blue-deep);
            background: #f0f4ff;
        }

        .tb-nav-menu a.active {
            color: var(--blue-deep);
            background: #eff6ff;
            border-bottom: 2px solid var(--blue-deep);
            border-radius: 10px 10px 0 0;
            font-weight: 700;
        }

        /* ── 페이지 래퍼 ── */
        .tb-page { min-height: calc(100vh - 68px); }

        /* ── 공통 카드 ── */
        .tb-card {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-card);
        }

        /* ── 공통 버튼 ── */
        .btn-tb-main {
            background: linear-gradient(135deg, var(--blue), var(--blue-deep));
            color: #fff;
            font-size: 14px;
            font-weight: 700;
            padding: 13px 24px;
            border-radius: var(--radius-md);
            border: none;
            cursor: pointer;
            box-shadow: var(--shadow-btn);
            letter-spacing: -0.2px;
            transition: opacity 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: inherit;
        }
        .btn-tb-main:hover { opacity: 0.88; color: #fff; }

        .btn-tb-sec {
            background: #fff;
            color: #64748b;
            font-size: 14px;
            font-weight: 600;
            padding: 12px 20px;
            border-radius: var(--radius-md);
            border: 1.5px solid var(--border);
            cursor: pointer;
            transition: border-color 0.15s, color 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: inherit;
        }
        .btn-tb-sec:hover { border-color: var(--blue); color: var(--blue); }

        /* ── form select ── */
        .tb-select {
            height: 44px;
            border-radius: 11px;
            border: 1.5px solid var(--border);
            background: #fafcff;
            padding: 0 14px;
            font-size: 14px;
            color: var(--text-main);
            appearance: none;
            width: 100%;
            font-family: inherit;
            font-weight: 500;
        }
        .tb-select:focus {
            outline: none;
            border-color: var(--blue);
            box-shadow: 0 0 0 3px rgba(59,130,246,0.12);
        }

        /* ── 혼잡도 배지 ── */
        .badge-여유 { background: #ecfdf5; color: #059669; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; }
        .badge-보통 { background: #fefce8; color: #ca8a04; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; }
        .badge-혼잡 { background: #fef2f2; color: #dc2626; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; }
        .badge-만차 { background: #1e1b4b; color: #fff; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; }

        /* ── 미디어 쿼리 ── */
        @media (max-width: 991px) {
            .tb-nav { padding: 12px 20px; }
            .tb-nav-menu a { padding: 7px 10px; font-size: 12px; }
        }
        @media (max-width: 575px) {
            .tb-nav { flex-direction: column; align-items: flex-start; gap: 10px; }
            .tb-nav-menu { flex-wrap: wrap; gap: 6px; }
        }
    </style>

    {% block extra_style %}{% endblock %}
</head>
<body>

<nav class="tb-nav">
    <a href="{% url 'home' %}" class="tb-brand">
        <img src="{% static 'bus/images/TB_logo.png' %}" alt="Tomorrow Bus 로고" class="tb-logo-img">
        <div class="tb-brand-text">
            <span class="tb-brand-name">Tomorrow Bus</span>
            <span class="tb-brand-sub">서울 광역버스 잔여좌석 예측 서비스</span>
        </div>
    </a>

    <nav class="tb-nav-menu">
        <a href="{% url 'home' %}"
           {% if request.resolver_match.url_name == 'home' %}class="active"{% endif %}>홈</a>
        <a href="{% url 'service1' %}"
           {% if request.resolver_match.url_name == 'service1' %}class="active"{% endif %}>서비스1 (정류장 단위 예측)</a>
        <a href="{% url 'service2' %}"
           {% if request.resolver_match.url_name == 'service2' %}class="active"{% endif %}>서비스2 (노선 전체 예측)</a>
        <a href="{% url 'favorites' %}"
           {% if request.resolver_match.url_name == 'favorites' %}class="active"{% endif %}>즐겨찾기</a>
    </nav>
</nav>

<div class="tb-page">
    {% block content %}{% endblock %}
</div>

{% include "footer.html" %}

{% block extra_script %}{% endblock %}
</body>
</html>
