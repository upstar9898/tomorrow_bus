<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Tomorrow Bus{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        :root {
            --bg-top: #f4f9ff;
            --bg-mid: #eef6ff;
            --bg-bottom: #fdfefe;
            --surface: rgba(255, 255, 255, 0.78);
            --surface-strong: #ffffff;
            --text-main: #1f2a37;
            --text-sub: #64748b;
            --line: rgba(148, 163, 184, 0.22);
            --primary: #2563eb;
            --primary-soft: rgba(37, 99, 235, 0.10);
            --primary-deep: #1d4ed8;
            --mint: #14b8a6;
            --shadow-lg: 0 24px 60px rgba(37, 99, 235, 0.10);
            --shadow-md: 0 14px 32px rgba(15, 23, 42, 0.08);
            --radius-xl: 28px;
            --radius-lg: 22px;
            --radius-md: 18px;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            min-height: 100%;
        }

        body {
            font-family: "Segoe UI", "Malgun Gothic", sans-serif;
            color: var(--text-main);
            background:
                radial-gradient(circle at top left, rgba(37, 99, 235, 0.16), transparent 24%),
                radial-gradient(circle at right top, rgba(20, 184, 166, 0.12), transparent 22%),
                linear-gradient(180deg, var(--bg-top) 0%, var(--bg-mid) 44%, var(--bg-bottom) 100%);
        }

        .site-shell {
            width: min(1180px, calc(100% - 32px));
            margin: 24px auto 40px;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
            padding: 18px 22px;
            border: 1px solid rgba(255, 255, 255, 0.65);
            border-radius: var(--radius-lg);
            background: var(--surface);
            backdrop-filter: blur(20px);
            box-shadow: var(--shadow-md);
        }

        .brand-group {
            display: flex;
            align-items: center;
            gap: 14px;
            min-width: 0;
        }

        .brand-mark {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--primary) 0%, #60a5fa 100%);
            color: #fff;
            font-weight: 800;
            box-shadow: 0 12px 24px rgba(37, 99, 235, 0.22);
            flex-shrink: 0;
        }

        .brand-text {
            min-width: 0;
        }

        .brand-title {
            display: block;
            color: var(--text-main);
            text-decoration: none;
            font-size: 1.15rem;
            font-weight: 800;
            line-height: 1.1;
        }

        .brand-subtitle {
            margin-top: 4px;
            color: var(--text-sub);
            font-size: 0.92rem;
        }

        .topbar-menu {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .topbar-menu a {
            text-decoration: none;
            color: var(--text-main);
            font-weight: 700;
            font-size: 0.95rem;
            padding: 10px 14px;
            border-radius: 999px;
            transition: all 0.2s ease;
        }

        .topbar-menu a:hover {
            background: var(--primary-soft);
            color: var(--primary-deep);
        }

        .page-wrap {
            margin-top: 22px;
        }

        .page-container {
            width: 100%;
        }

        .glass-card {
            border: 1px solid rgba(255, 255, 255, 0.72);
            border-radius: var(--radius-xl);
            background: var(--surface);
            backdrop-filter: blur(18px);
            box-shadow: var(--shadow-lg);
        }

        .section-card {
            border: 1px solid rgba(226, 232, 240, 0.9);
            border-radius: var(--radius-lg);
            background: var(--surface-strong);
            box-shadow: 0 18px 36px rgba(15, 23, 42, 0.06);
        }

        .metric-box {
            border: 1px solid #e8eef7;
            border-radius: var(--radius-md);
            background: linear-gradient(180deg, #ffffff 0%, #f8fbff 100%);
            padding: 1rem;
            height: 100%;
        }

        .badge-soft {
            background: var(--primary-soft);
            color: var(--primary-deep);
            border: 1px solid rgba(37, 99, 235, 0.10);
        }

        .seat-number {
            font-size: clamp(2.4rem, 4vw, 3.2rem);
            font-weight: 800;
            line-height: 1;
            color: var(--primary);
        }

        .table-wrap {
            border-radius: 18px;
            overflow: hidden;
            border: 1px solid #e9eef5;
        }

        .soft-note {
            color: var(--text-sub);
        }

        .hero-gradient {
            background:
                radial-gradient(circle at top right, rgba(96, 165, 250, 0.22), transparent 30%),
                linear-gradient(135deg, rgba(255,255,255,0.94) 0%, rgba(240,248,255,0.98) 100%);
        }

        .btn-primary {
            background-color: var(--primary);
            border-color: var(--primary);
            font-weight: 700;
        }

        .btn-primary:hover {
            background-color: var(--primary-deep);
            border-color: var(--primary-deep);
        }

        .btn-outline-secondary {
            border-color: #cbd5e1;
            color: #334155;
            font-weight: 700;
        }

        .btn-outline-secondary:hover {
            background: #f8fafc;
            color: #0f172a;
            border-color: #94a3b8;
        }

        .form-control,
        .form-select {
            min-height: 48px;
            border-radius: 14px;
            border-color: #d9e2ef;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: #93c5fd;
            box-shadow: 0 0 0 0.2rem rgba(37, 99, 235, 0.14);
        }

        .table thead th {
            white-space: nowrap;
        }

        @media (max-width: 991px) {
            .site-shell {
                width: min(100% - 20px, 1180px);
                margin-top: 14px;
                margin-bottom: 28px;
            }

            .topbar {
                flex-direction: column;
                align-items: flex-start;
                padding: 16px;
            }

            .topbar-menu {
                width: 100%;
                gap: 8px;
            }

            .topbar-menu a {
                padding: 9px 12px;
                font-size: 0.92rem;
            }

            .page-wrap {
                margin-top: 16px;
            }
        }

        @media (max-width: 575px) {
            .brand-subtitle {
                font-size: 0.84rem;
            }

            .topbar-menu {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                width: 100%;
            }

            .topbar-menu a {
                text-align: center;
            }
        }
    </style>

    {% block extra_style %}{% endblock %}
</head>
<body>
    <div class="site-shell">
        <header class="topbar">
            <div class="brand-group">
                <div class="brand-mark">TB</div>
                <div class="brand-text">
                    <a href="{% url 'home' %}" class="brand-title">Tomorrow Bus</a>
                    <div class="brand-subtitle">서울 광역버스 잔여좌석 예측 서비스</div>
                </div>
            </div>

            <nav class="topbar-menu">
                <a href="{% url 'home' %}">홈</a>
                <a href="{% url 'service1' %}">서비스1</a>
                <a href="{% url 'service2' %}">서비스2</a>
                <a href="{% url 'favorites' %}">즐겨찾기</a>
            </nav>
        </header>

        <div class="page-wrap">
            <div class="page-container">
                {% block content %}{% endblock %}
            </div>
        </div>
    </div>

    {% block extra_script %}{% endblock %}
</body>
</html>
